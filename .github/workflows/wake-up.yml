name: Scheduled Render Wakeup

on:
  schedule:
    # Subah 10:00 AM se Shaam 07:00 PM IST (Monday to Friday)
    - cron: '*/20 4-13 * * 1-5'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Requests
        run: |
          curl -s https:conversaai-yvmt.onrender.com  > /dev/null
          curl -s https:conversaai-yvmt.onrender.com  > /dev/null
          curl -s https:conversaai-yvmt.onrender.com  > /dev/null


          echo "All services pinged successfully at $(date)"

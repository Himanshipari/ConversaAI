name: Scheduled Render Wakeup

on:
  schedule:
    # Subah 10:00 AM se Shaam 07:00 PM IST (Monday to Friday)
    - cron: '*/20 4-13 * * 1-5'
  workflow_dispatch: # Isse manual test karne ka button aa jayega

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Requests
        run: |
          curl -s https:conversaai-yvmt.onrender.com  > /dev/null
          curl -s https:airbnb-clone-mern-aizr.onrender.com  > /dev/null
          curl -s https:zerodha-frontend-2q4h.onrender.com > /dev/null
          curl -s https://zerodha-backend-nu2q.onrender.com > /dev/null
          echo "All services pinged successfully at $(date)"
